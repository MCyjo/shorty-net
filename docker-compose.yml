name: shorty

# Local infrastructure. Host ports differ from the PayFlow project's compose file, so both can run side by side.
# Copy .env.example to .env before `docker compose up`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shorty
      POSTGRES_DB: shorty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorty -d shorty"]
      interval: 5s
      retries: 10

  # A cache, not a database: no persistence, bounded memory, least-recently-used eviction. Anything lost is rebuilt
  # from PostgreSQL on the next request (see docs/adr/0001-redis-in-a-container.md).
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Azure Event Hubs emulator (and Azurite, which it keeps its metadata in). Local development and tests only: it has no
  # Entra ID, no Capture, and forgets its data on restart. Running it means accepting Microsoft's licence terms, so ACCEPT_EULA
  # must be set by whoever runs it (see .env.example).
  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    volumes:
      - ./docker/eventhubs/Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"   # AMQP
      - "5300:5300"   # health
    depends_on:
      - azurite

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports:
      - "10000:10000"   # blob: the worker keeps its checkpoints here

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      DASHBOARD__API__ENABLED: "true"           # lets tests and scripts read traces back
      DASHBOARD__API__AUTHMODE: Unsecured
    ports:
      - "18890:18888"   # UI
      - "4327:18889"    # OTLP gRPC

volumes:
  pgdata:
